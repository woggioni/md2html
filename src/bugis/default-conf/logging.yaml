version: 1
disable_existing_loggers: True
handlers:
  console:
    class : logging.StreamHandler
    formatter: default
    level   : INFO
    stream  : ext://sys.stderr
  access:
    class : logging.StreamHandler
    formatter: request
    level   : INFO
    stream  : ext://sys.stderr
formatters:
  brief:
    format: '%(message)s'
  default:
    format: '{asctime} [{levelname}] ({processName:s}/{threadName:s}) - {name} - {message}'
    style: '{'
    datefmt: '%Y-%m-%d %H:%M:%S'
  request:
    format: '{asctime} {client[0]}:{client[1]} HTTP/{http_version} {method} {path} - {status}'
    style: '{'
    datefmt: '%Y-%m-%d %H:%M:%S'
loggers:
  root:
    handlers: [console]
    level: DEBUG
  access:
    handlers: [access]
    level: INFO
  watchdog.observers.inotify_buffer:
    level: INFO
  MARKDOWN:
    level: INFO